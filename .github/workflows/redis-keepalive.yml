name: Upstash Redis keep-alive (primary)

# Upstash archives free-tier databases after a minimum of 30 days of inactivity.
# This repo's Socket.IO adapter, conversation cache and unread counts all live on
# that instance, so an archived database means a cold, broken chat backend.
#
# Cadence: "0 6 */5 * *" fires on days 1, 6, 11, 16, 21, 26 and then resets at the
# month boundary. That is NOT literally every five days — the longest real gap is
# 6 days (26th -> 1st in a 31-day month), which still leaves ~5x margin against
# the 30-day window.
#
# ── Known failure mode, mitigated ──────────────────────────────────────────────
# GitHub disables scheduled workflows after 60 days of repository inactivity, and
# ONLY NEW COMMITS reset that timer — issues, PRs, releases, tags and manual
# workflow_dispatch runs do not count. A quiet majestic-chat would therefore lose
# this schedule silently, precisely when a keep-alive matters most.
#
# Mitigation: a PING-only backup of this workflow lives in majestic-escape-ops,
# which is actively committed. Either workflow alone is enough to keep the
# database warm. GitHub also emails the repo owner on auto-disable.
#
# Secret required: REDIS_URL (rediss://…upstash.io:6379) — add under
# Settings -> Secrets and variables -> Actions.

on:
  schedule:
    - cron: "0 6 */5 * *"
  workflow_dispatch:

concurrency:
  group: redis-keepalive
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # for the failure-notification issue

jobs:
  keepalive:
    runs-on: ubuntu-22.04
    steps:
      - name: Install redis-tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-tools
          redis-cli --version

      # Host and port are not secret; the password is. Splitting the URL here
      # lets us pass credentials via REDISCLI_AUTH (env) instead of putting the
      # full URL in argv, where it would be visible to `ps` on the runner.
      - name: Parse connection details
        id: conn
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${REDIS_URL:-}" ]; then
            echo "::error::REDIS_URL secret is not set on this repository."
            exit 1
          fi
          node -e '
            const u = new URL(process.env.REDIS_URL);
            const fs = require("fs");
            // Only host/port reach the log or outputs — never the password.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `host=${u.hostname}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `port=${u.port || 6379}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `REDISCLI_AUTH=${decodeURIComponent(u.password)}\n`);
          '

      - name: PING + touch keep-alive key
        env:
          HOST: ${{ steps.conn.outputs.host }}
          PORT: ${{ steps.conn.outputs.port }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # REDISCLI_AUTH is read from the environment by redis-cli itself.
          RC="redis-cli --tls -h $HOST -p $PORT"

          PONG="$($RC PING)"
          echo "PING -> $PONG"
          [ "$PONG" = "PONG" ] || { echo "::error::Unexpected PING reply: $PONG"; exit 1; }

          # A dedicated non-business key. PING alone almost certainly registers as
          # activity, but a write removes any ambiguity about what Upstash counts.
          # TTL 14 days > the 6-day worst-case gap, so the key persists between
          # runs yet disappears on its own if this workflow ever stops.
          $RC SET keepalive:last-run "run-$RUN_ID" EX 1209600 > /dev/null
          echo "GET  -> $($RC GET keepalive:last-run)"
          echo "DBSIZE -> $($RC DBSIZE)"
          echo "Upstash keep-alive completed."

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Upstash Redis keep-alive failed — run #${context.runNumber}`,
              body: `Workflow **${context.workflow}** failed. If this keeps failing, the Upstash database risks archival after 30 days of inactivity.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
